apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dagster-postgres
spec:
  selector:
    matchLabels:
      app: dagster-postgres
  replicas: 1
  serviceName: dagster-postgres
  template:
    metadata:
      labels:
        app: dagster-postgres
    spec:
      containers:
      - name: database
        image: us-west1-docker.pkg.dev/digital-ucdavis-edu/pub/anduin-pg:main
        args: ["-c", "max_connections=200"]
        imagePullPolicy: Always
        env:
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        # Dagster's run/event-log storage takes a heavy read/write hit during
        # pipeline execution — sized up relative to the shared instance.
        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
        ports:
        - containerPort: 5432
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        envFrom:
          - secretRef:
              name: dagster-postgres-password
        volumeMounts:
        - name: data-volume
          mountPath: /var/lib/postgresql/data
        - name: dshm
          mountPath: /dev/shm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
  volumeClaimTemplates:
  - metadata:
      name: data-volume
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 20Gi
