apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dagster-postgres
spec:
  template:
    spec:
      containers:
        - name: database
          image: us-west1-docker.pkg.dev/digital-ucdavis-edu/pub/anduin-pg:16
      nodeSelector:
        intended-for: argonath-prod-backend
  volumeClaimTemplates:
    - metadata:
        name: data-volume
      spec:
        storageClassName: microk8s-hostpath
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
