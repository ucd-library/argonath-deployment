apiVersion: apps/v1
kind: Deployment
metadata:
  name: dagster
spec:
  selector:
    matchLabels:
      app: dagster
  template:
    metadata:
      labels:
        app: dagster
    spec:
      containers:
      - name: service
        image: us-west1-docker.pkg.dev/digital-ucdavis-edu/pub/dagster:main
        imagePullPolicy: Always
        resources:
          requests:
            memory: "200Mi"
            cpu: "200m"
        env:
          - name: DIGTK_POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-password
                key: POSTGRES_PASSWORD
          - name: DIGTK_REPORTING_PG_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-password
                key: POSTGRES_PASSWORD
        envFrom:
          - configMapRef:
              name: app-config
          - secretRef:
              name: dagster-postgres-password
          - secretRef:
              name: samwise-api-key
          - secretRef:
              name: preservica-username
          - secretRef:
              name: preservica-password
        volumeMounts:
        - name: dagster-storage-volume-claim
          mountPath: /opt/dagster/dagster_home/storage
        - name: caskfs-volume-claim
          mountPath: /opt/cache
      volumes:
      - name: caskfs-volume-claim
        persistentVolumeClaim:
          claimName: caskfs
      - name: dagster-storage-volume-claim
        persistentVolumeClaim:
          claimName: dagster-storage
