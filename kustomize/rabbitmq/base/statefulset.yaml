apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
spec:
  selector:
    matchLabels:
      app: rabbitmq
  replicas: 1
  serviceName: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: broker
        image: rabbitmq:3-management
        imagePullPolicy: Always
        env:
        - name: RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS
          value: "-rabbit consumer_timeout 21600000" # 6h timeout (per step)
        resources:
          requests:
            memory: "200Mi"
            cpu: "200m"
        ports:
        - containerPort: 5672
        - containerPort: 15672
        volumeMounts:
        - name: data-volume
          mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
  - metadata:
      name: data-volume
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 5Gi
