apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: superset
spec:
  template:
    spec:
      containers:
        - name: service
          image: >-
            us-west1-docker.pkg.dev/digital-ucdavis-edu/pub/argonath-superset:main
      nodeSelector:
        intended-for: argonath-prod-backend
  volumeClaimTemplates:
    - metadata:
        name: superset-home
      spec:
        storageClassName: microk8s-hostpath
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
    - metadata:
        name: superset-init
      spec:
        storageClassName: microk8s-hostpath
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
