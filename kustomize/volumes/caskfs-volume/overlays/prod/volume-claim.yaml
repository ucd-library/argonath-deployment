# NOTE: storageClassName is a placeholder — swap in whatever NFS-backed
# StorageClass exists on libk8s (e.g. an nfs-subdir-external-provisioner
# class) before applying.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: caskfs
spec:
  storageClassName: nfs-csi
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 200Gi
