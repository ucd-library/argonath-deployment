# NOTE: image is a placeholder — argonath has no dedicated build yet.
# Currently no argonath-specific extension to cask itself is needed, so
# pointing this at a real argonath-tagged build (or just caskfs's own
# upstream image directly) both work; adjust once a build pipeline exists.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cask
spec:
  template:
    spec:
      containers:
        - name: service
          image: us-west1-docker.pkg.dev/argonath/pub/argonath-cask:prod
      nodeSelector:
        intended-for: argonath-prod-backend
